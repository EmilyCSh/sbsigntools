name: Fedora Latest

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Fedora Latest (${{ matrix.arch }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.runner }}
    container: fedora:latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-26.04-arm

    steps:
      - name: Install Dependencies
        run: |
          dnf install -y \
            bash ca-certificates clang cmake coreutils diffutils gawk \
            gcc git gnu-efi-devel grep help2man libuuid-devel lld make \
            ninja-build openssl openssl-devel openssl-devel-engine \
            pkgconf-pkg-config sed util-linux

      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          printf '::add-mask::%s\n' "$auth"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DBUILD_MAN_PAGES=ON

      - name: Build
        run: cmake --build build-ci

      - name: Test
        run: ctest --test-dir build-ci --output-on-failure --no-tests=error