name: FreeBSD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: FreeBSD 15.1 (x86_64, clang)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: x86_64
          prepare: |
            set -eu
            pkg install -y bash cmake help2man libuuid ninja openssl pkgconf
          run: |
            set -eu
            cmake -S . -B build-ci -G Ninja \
              -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=ON -DBUILD_MAN_PAGES=ON
            cmake --build build-ci
            ctest --test-dir build-ci --output-on-failure --no-tests=error